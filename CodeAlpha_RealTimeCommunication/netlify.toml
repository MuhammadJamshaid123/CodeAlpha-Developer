[build]
  publish = "public"

[[redirects]]
  from = "/api/*"
  to = "https://codealpha-rtc.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://codealpha-rtc.onrender.com/uploads/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/socket.io/*"
  to = "https://codealpha-rtc.onrender.com/socket.io/:splat"
  status = 200
  force = true
