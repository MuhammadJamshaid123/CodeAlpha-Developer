<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - CodeAlpha Connect</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar"><a href="/" class="logo">📹 CodeAlpha Connect</a></nav>
  <main class="container">
    <div class="auth-box">
      <div class="tabs">
        <button class="tab active" onclick="showTab('login')">Login</button>
        <button class="tab" onclick="showTab('register')">Register</button>
      </div>
      <form id="login-form" onsubmit="handleLogin(event)">
        <h2>Login</h2>
        <input name="username" placeholder="Username" required>
        <input name="password" type="password" placeholder="Password" required>
        <button type="submit" class="btn btn-primary">Login</button>
        <p id="login-error" class="error"></p>
      </form>
      <form id="register-form" class="hidden" onsubmit="handleRegister(event)">
        <h2>Register</h2>
        <input name="username" placeholder="Username" required>
        <input name="password" type="password" placeholder="Password" required minlength="6">
        <button type="submit" class="btn btn-primary">Register</button>
        <p id="register-error" class="error"></p>
      </form>
    </div>
  </main>
  <script src="/js/config.js"></script>
  <script>
    function showTab(t) {
      document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
      document.getElementById('login-form').classList.toggle('hidden', t !== 'login');
      document.getElementById('register-form').classList.toggle('hidden', t !== 'register');
      document.querySelector(`.tab:${t === 'login' ? 'first' : 'last'}-child`).classList.add('active');
    }
    async function handleLogin(e) {
      e.preventDefault();
      const f = e.target;
      const res = await apiFetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: f.username.value, password: f.password.value }) });
      if (res.ok) { saveAuth(await res.json()); location.href = '/'; return; }
      const err = await res.json().catch(() => ({}));
      document.getElementById('login-error').textContent = err.error || 'Cannot reach server. Deploy backend on Render first.';
    }
    async function handleRegister(e) {
      e.preventDefault();
      const f = e.target;
      const res = await apiFetch('/api/register', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: f.username.value, password: f.password.value }) });
      if (res.ok) { saveAuth(await res.json()); location.href = '/'; return; }
      const err = await res.json().catch(() => ({}));
      document.getElementById('register-error').textContent = err.error || 'Cannot reach server. Deploy backend on Render first.';
    }
  </script>
</body>
</html>
