<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Register - CodeAlpha Shop</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="logo">🛒 CodeAlpha Shop</a>
    <div class="nav-links">
      <a href="/">Products</a>
      <a href="/cart.html">Cart</a>
    </div>
  </nav>

  <main class="container">
    <div class="auth-container">
      <div class="auth-tabs">
        <button class="tab active" onclick="showTab('login')">Login</button>
        <button class="tab" onclick="showTab('register')">Register</button>
      </div>

      <form id="login-form" class="auth-form" onsubmit="handleLogin(event)">
        <h2>Login</h2>
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit" class="btn btn-primary">Login</button>
        <p id="login-error" class="error"></p>
      </form>

      <form id="register-form" class="auth-form hidden" onsubmit="handleRegister(event)">
        <h2>Create Account</h2>
        <input type="text" name="username" placeholder="Username" required>
        <input type="email" name="email" placeholder="Email (optional)">
        <input type="password" name="password" placeholder="Password" required minlength="6">
        <button type="submit" class="btn btn-primary">Register</button>
        <p id="register-error" class="error"></p>
      </form>
    </div>
  </main>

  <script>
    function showTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.auth-form').forEach(f => f.classList.add('hidden'));
      if (tab === 'login') {
        document.querySelector('.tab:first-child').classList.add('active');
        document.getElementById('login-form').classList.remove('hidden');
      } else {
        document.querySelector('.tab:last-child').classList.add('active');
        document.getElementById('register-form').classList.remove('hidden');
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const form = e.target;
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: form.username.value,
          password: form.password.value
        })
      });
      const data = await res.json();
      if (res.ok) window.location.href = '/';
      else document.getElementById('login-error').textContent = data.error;
    }

    async function handleRegister(e) {
      e.preventDefault();
      const form = e.target;
      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: form.username.value,
          email: form.email.value,
          password: form.password.value
        })
      });
      const data = await res.json();
      if (res.ok) window.location.href = '/';
      else document.getElementById('register-error').textContent = data.error;
    }
  </script>
</body>
</html>
