<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeAlpha Shop - Home</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="logo">🛒 CodeAlpha Shop</a>
    <div class="nav-links">
      <a href="/">Products</a>
      <a href="/cart.html">Cart <span id="cart-count" class="badge">0</span></a>
      <a href="/orders.html" id="orders-link" class="hidden">Orders</a>
      <span id="user-info"></span>
      <a href="/login.html" id="auth-link">Login</a>
    </div>
  </nav>

  <main class="container">
    <header class="hero">
      <h1>Welcome to CodeAlpha Shop</h1>
      <p>Discover quality tech products at great prices</p>
    </header>
    <div id="products" class="product-grid"></div>
  </main>

  <script src="/js/app.js"></script>
  <script>
    async function loadProducts() {
      const res = await fetch('/api/products');
      const products = await res.json();
      document.getElementById('products').innerHTML = products.map(p => `
        <div class="product-card">
          <div class="product-image">${p.image || '📦'}</div>
          <h3>${p.name}</h3>
          <p class="description">${p.description}</p>
          <div class="product-footer">
            <span class="price">$${p.price.toFixed(2)}</span>
            <div class="actions">
              <a href="/product.html?id=${p.id}" class="btn btn-outline">View</a>
              <button class="btn btn-primary" onclick="addToCart(${p.id})">Add to Cart</button>
            </div>
          </div>
        </div>
      `).join('');
    }
    loadProducts();
  </script>
</body>
</html>
